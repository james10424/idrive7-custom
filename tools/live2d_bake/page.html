<title>Miku bake</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 16px; background: #111; color: #ddd; font: 13px -apple-system, Helvetica, sans-serif; }
  #log { white-space: pre-wrap; font: 12px ui-monospace, Menlo, monospace; color: #9c9; }

  .cell { width: 128px; font-size: 10px; color: #aaa; word-break: break-all; }
  .cell canvas { width: 128px; height: 128px; background: #333; display: block; }
  img, canvas.big { background: repeating-conic-gradient(#2a2a2a 0 25%, #333 0 50%) 0 0 / 16px 16px; max-width: 100%; }

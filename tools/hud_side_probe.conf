# HUD side-slot probe: append to /var/opt/cluster-render/cluster-render.local.conf on the car, then
#   systemctl restart cluster-render
# Remove these lines (and restart) to undo. See tools/hud_side_probe.js.
#
# cluster-render refuses keys it does not define (a "side_" target stopped it from starting), so the probe borrows the
# map target, unused here (it is the Waze map's on the cluster), and points it at BMW's HUD pop-up slot 0x322, which
# stayed enabled while BMW's guidance showed in 0x300 (our main HUD slot 0x323 switches 0x300 off). Its scene id
# 0x010004f0 is one the KOMBI is known to take. No take-over (it would unmap BMW's pop-ups) and no guide hold (it holds
# the cluster's turn box while the map target shows). Class 0 like our other targets; the size is a guess, the probe's
# picture shows how the slot crops or scales it.
map_slot = 0x322
map_size = 800x480
map_take_over_stock = 0
guide_hold = 0
# end of HUD side-slot probe
